[project]
name = "wikillm"
version = "0.1.0"
description = "Comparación experimental entre RAG y WikiLLM sobre un corpus de arXiv, con el mismo modelo en ambos sistemas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "openai>=3.46.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikillm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: estilo, F: errores, I: orden de imports, UP: sintaxis moderna, B: errores comunes
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# PyTorch con CUDA 12.6 en Windows y Linux (decisión 0002). El mismo paquete funciona sin GPU
# poniendo EMBEDDING_DEVICE=cpu. En macOS se usa el paquete por defecto.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

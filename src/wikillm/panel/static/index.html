<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de la demostración</title>
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f8f9fb; --texto:#0f172a; --suave:#64748b; --borde:#e2e8f0;
  --acento:#4338ca; --acento-fondo:#eef2ff;
  --rag:#1d4ed8; --rag-fondo:#eff6ff; --rag-borde:#bfdbfe;
  --wiki:#047857; --wiki-fondo:#ecfdf5; --wiki-borde:#a7f3d0;
  --ok:#047857; --aviso:#b45309; --aviso-fondo:#fffbeb; --error:#b91c1c; --error-fondo:#fef2f2;
  --repro:#92400e; --repro-fondo:#fef3c7; --repro-borde:#f59e0b;
  --term-fondo:#0b1020; --term-texto:#cbd5e1; --term-cmd:#93c5fd; --term-err:#fca5a5; --term-suave:#64748b;
  --sombra:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --bg:#0b1220; --panel:#111a2e; --panel2:#0e1627; --texto:#e5e7eb; --suave:#94a3b8; --borde:#24304a;
    --acento:#a5b4fc; --acento-fondo:#1e2347;
    --rag:#60a5fa; --rag-fondo:#0f1d3a; --rag-borde:#1e3a8a;
    --wiki:#34d399; --wiki-fondo:#0a2a22; --wiki-borde:#065f46;
    --ok:#34d399; --aviso:#fbbf24; --aviso-fondo:#2a1f05; --error:#f87171; --error-fondo:#2b1114;
    --repro:#fcd34d; --repro-fondo:#2a1f05; --repro-borde:#b45309;
    --term-fondo:#050914; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-tema="oscuro"]{
  --bg:#0b1220; --panel:#111a2e; --panel2:#0e1627; --texto:#e5e7eb; --suave:#94a3b8; --borde:#24304a;
  --acento:#a5b4fc; --acento-fondo:#1e2347;
  --rag:#60a5fa; --rag-fondo:#0f1d3a; --rag-borde:#1e3a8a;
  --wiki:#34d399; --wiki-fondo:#0a2a22; --wiki-borde:#065f46;
  --ok:#34d399; --aviso:#fbbf24; --aviso-fondo:#2a1f05; --error:#f87171; --error-fondo:#2b1114;
  --repro:#fcd34d; --repro-fondo:#2a1f05; --repro-borde:#b45309;
  --term-fondo:#050914; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--texto);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input,select{font:inherit;color:inherit}
code,pre,.mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
a{color:var(--acento)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100vh}

/* barra superior */
#barra{display:flex;align-items:center;gap:.8rem;padding:.5rem 1rem;background:var(--panel);border-bottom:1px solid var(--borde);flex-wrap:wrap}
#barra h1{font-size:1.05rem;margin:0;white-space:nowrap}
#barra .grupo{display:flex;align-items:center;gap:.5rem}
#barra .espacio{flex:1}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .55rem;border-radius:999px;border:1px solid var(--borde);background:var(--panel2);font-size:.82rem;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip.aviso{color:var(--aviso);background:var(--aviso-fondo);border-color:currentColor}
.chip.error{color:var(--error);background:var(--error-fondo);border-color:currentColor}
.chip.rag{color:var(--rag);background:var(--rag-fondo);border-color:var(--rag-borde)}
.chip.wiki{color:var(--wiki);background:var(--wiki-fondo);border-color:var(--wiki-borde)}
.chip.acento{color:var(--acento);background:var(--acento-fondo);border-color:transparent}
.punto{width:.55rem;height:.55rem;border-radius:50%;background:var(--suave);display:inline-block}
.punto.ok{background:var(--ok)}.punto.aviso{background:var(--aviso)}.punto.error{background:var(--error)}
.boton{border:1px solid var(--borde);background:var(--panel);border-radius:.6rem;padding:.35rem .8rem;line-height:1.2}
.boton:hover:not(:disabled){border-color:var(--acento)}
.boton.primario{background:var(--acento);color:#fff;border-color:var(--acento);font-weight:600}
:root[data-tema="oscuro"] .boton.primario{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-tema="claro"]) .boton.primario{color:#0b1220}}
.boton.peligro{border-color:var(--error);color:var(--error)}
.boton.fantasma{background:transparent}
.boton.chico{padding:.15rem .5rem;font-size:.85rem}
.tecla{font:.72rem ui-monospace,Consolas,monospace;border:1px solid var(--borde);border-bottom-width:2px;border-radius:.3rem;padding:0 .3rem;margin-left:.3rem;color:var(--suave);background:var(--panel2)}
.boton.primario .tecla{color:inherit;background:transparent;border-color:rgba(255,255,255,.5)}

/* cuerpo */
#cuerpo{flex:1;display:flex;min-height:0}
#nav{width:16rem;flex:none;overflow:auto;border-right:1px solid var(--borde);background:var(--panel);padding:.6rem}
#nav h2{display:none;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin:.2rem .4rem .5rem}
.item-paso{display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:.7rem;padding:.5rem .55rem;margin-bottom:.2rem}
.item-paso:hover{background:var(--panel2)}
.item-paso.actual{background:var(--acento-fondo);border-color:var(--acento)}
.item-paso .num{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--borde);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.item-paso.actual .num{background:var(--acento);color:#fff}
.item-paso.hecho .num{background:var(--ok);color:#fff}
.item-paso b{display:block;font-size:.92rem;line-height:1.25}
.item-paso small{color:var(--suave);font-size:.78rem}
.item-paso .tiempo-ok{color:var(--ok)}.item-paso .tiempo-pasado{color:var(--error)}
#principal{flex:1;min-width:0;overflow:auto;padding:1rem 1.25rem 2rem}
#visor{width:min(48%,46rem);flex:none;border-left:1px solid var(--borde);background:var(--panel);display:flex;flex-direction:column;min-height:0}

/* paso y acciones */
.paso-cab{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:baseline;margin-bottom:.2rem}
.paso-cab h2{font-size:1.45rem;margin:0}
.paso-cab .meta{color:var(--suave);font-size:.9rem}
.objetivo{margin:.2rem 0 .8rem;font-size:1.05rem;max-width:62rem}
.lentes{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.7rem}
.acciones{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:.7rem}
.accion{background:var(--panel);border:1px solid var(--borde);border-radius:.9rem;padding:.65rem .8rem;box-shadow:var(--sombra);min-width:16rem;max-width:100%}
.accion .cab{display:flex;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.accion .cab b{font-size:.95rem}
.accion .botones{display:flex;gap:.4rem;flex-wrap:wrap}
.accion input[type=text],.accion input[type=number]{width:100%;border:1px solid var(--borde);background:var(--panel2);border-radius:.5rem;padding:.35rem .5rem;margin-bottom:.45rem}
.archivos-paso{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.archivos-paso .etq{color:var(--suave);font-size:.85rem}
.chip-archivo{cursor:pointer;font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
.chip-archivo:hover{border-color:var(--acento);color:var(--acento)}
.chip-archivo[disabled]{opacity:.45;cursor:not-allowed}
.visibles{margin:.2rem 0 1rem;padding-left:1.2rem;max-width:56rem}.visibles li{margin-bottom:.35rem}
.vacio{border:1px dashed var(--borde);border-radius:.9rem;padding:1.4rem;color:var(--suave);background:var(--panel2)}

/* ejecución */
.estado-run{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .6rem}
.estado-run h3{margin:0;font-size:1.05rem}
.aviso-repro{background:var(--repro-fondo);color:var(--repro);border:2px solid var(--repro-borde);border-radius:.7rem;padding:.5rem .8rem;margin:.2rem 0 .7rem;font-weight:600}
.aviso-error{background:var(--error-fondo);color:var(--error);border:1px solid var(--error);border-radius:.7rem;padding:.5rem .8rem;margin:.2rem 0 .7rem}
.girando{width:.9rem;height:.9rem;border:2px solid var(--borde);border-top-color:var(--acento);border-radius:50%;display:inline-block;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.pregunta-run{background:var(--panel);border:1px solid var(--borde);border-left:4px solid var(--acento);border-radius:.6rem;padding:.55rem .8rem;margin-bottom:.8rem}
.pregunta-run small{color:var(--suave);display:block}
.columnas{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;align-items:start}
@media (max-width:1100px){.columnas{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--borde);border-top:5px solid var(--borde);border-radius:.9rem;box-shadow:var(--sombra);overflow:hidden;min-width:0}
.col.rag{border-top-color:var(--rag)}.col.wiki{border-top-color:var(--wiki)}
.col-cab{padding:.6rem .8rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.col.rag .col-cab{background:var(--rag-fondo)}.col.wiki .col-cab{background:var(--wiki-fondo)}
.col-cab b{font-size:1.1rem}.col.rag .col-cab b{color:var(--rag)}.col.wiki .col-cab b{color:var(--wiki)}
.col-cab small{display:block;color:var(--suave);font-size:.8rem;max-width:22rem}
.col-cuerpo{padding:.7rem .85rem}
.col h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin:.9rem 0 .35rem}
.col h4:first-child{margin-top:0}
.col.esperando{opacity:.55}
.col.trabajando{box-shadow:0 0 0 2px var(--acento),var(--sombra)}
.linea-tiempo{list-style:none;margin:0;padding:0 0 0 .2rem}
.linea-tiempo li{position:relative;padding:0 0 .65rem 1.4rem}
.linea-tiempo li::before{content:"";position:absolute;left:.3rem;top:.35rem;bottom:-.1rem;width:2px;background:var(--borde)}
.linea-tiempo li:last-child::before{display:none}
.linea-tiempo li::after{content:"";position:absolute;left:0;top:.28rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--suave)}
.col.rag .linea-tiempo li::after{background:var(--rag)}.col.wiki .linea-tiempo li::after{background:var(--wiki)}
.linea-tiempo li.curso::after{background:transparent;border:2px solid var(--acento);border-top-color:transparent;animation:gira 1s linear infinite}
.accion-agente{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:0 .4rem;border-radius:.3rem;background:var(--panel2);border:1px solid var(--borde);margin-right:.35rem}
.accion-agente.search{color:var(--acento)}.accion-agente.read{color:var(--wiki)}.accion-agente.answer{color:var(--ok)}
.detalle{color:var(--suave);font-size:.85rem;margin-top:.15rem;word-break:break-word}
.paginas{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.25rem}
.respuesta{background:var(--panel2);border:1px solid var(--borde);border-radius:.6rem;padding:.6rem .75rem;white-space:pre-wrap;word-break:break-word}
.respuesta.abstencion{border-style:dashed;color:var(--suave)}
.cita-chip{display:inline-block;font:.74rem ui-monospace,Consolas,monospace;background:var(--acento-fondo);color:var(--acento);padding:0 .35rem;border-radius:.3rem;cursor:pointer;margin:0 .1rem}
.cita-chip:hover,.cita-chip.resalta{outline:2px solid var(--acento)}
.cita{border-left:3px solid var(--acento);padding:.2rem 0 .2rem .6rem;margin:.35rem 0;font-size:.9rem}
.cita .id{font:.78rem ui-monospace,Consolas,monospace;color:var(--acento)}
.cita .texto{color:var(--texto);opacity:.85}
.cita.resalta{background:var(--acento-fondo)}
.fragmento{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;border-bottom:1px dashed var(--borde);font-size:.85rem}
.fragmento:last-child{border-bottom:0}
.fragmento .dist{flex:none;width:5.2rem}
.fragmento .barra{height:.35rem;border-radius:2px;background:var(--borde);margin-top:.2rem;overflow:hidden}
.fragmento .barra i{display:block;height:100%;background:var(--rag)}
.fragmento .citado{color:var(--ok);font-weight:700}
.fragmento .id{font:.75rem ui-monospace,Consolas,monospace;color:var(--suave)}
.costos{display:flex;gap:.35rem;flex-wrap:wrap}
.tabla{width:100%;border-collapse:collapse;font-size:.88rem}
.tabla th,.tabla td{padding:.35rem .5rem;text-align:right;border-bottom:1px solid var(--borde);white-space:nowrap}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla th{color:var(--suave);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.tabla td.rag{color:var(--rag);font-weight:600}.tabla td.wiki{color:var(--wiki);font-weight:600}
.tabla .mejor{background:var(--acento-fondo);font-weight:700}
.comparacion{margin-top:.9rem;background:var(--panel);border:1px solid var(--borde);border-radius:.9rem;padding:.7rem .85rem;box-shadow:var(--sombra);overflow:auto}
.comparacion h4{margin:0 0 .4rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--suave)}
.relativo{color:var(--suave);font-size:.85rem;margin-top:.45rem}
.ingesta{background:var(--panel);border:1px solid var(--borde);border-top:5px solid var(--wiki);border-radius:.9rem;padding:.8rem 1rem;box-shadow:var(--sombra)}
.etapas{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:.6rem 0}
@media (max-width:1100px){.etapas{grid-template-columns:1fr 1fr}}
.etapa{border:1px solid var(--borde);border-radius:.7rem;padding:.5rem .7rem;background:var(--panel2)}
.etapa.hecha{border-color:var(--wiki-borde);background:var(--wiki-fondo)}
.etapa.curso{border-color:var(--acento)}
.etapa b{display:block}.etapa small{color:var(--suave)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin:.6rem 0}
.tile{border:1px solid var(--borde);border-radius:.7rem;padding:.5rem .7rem;background:var(--panel2)}
.tile .v{font-size:1.5rem;font-weight:700}.tile .k{color:var(--suave);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.recorrido{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:0 0 .9rem;padding:.5rem .6rem;border:1px solid var(--borde);border-radius:.8rem;background:var(--panel);box-shadow:var(--sombra)}
.recorrido .etq{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin-right:.2rem}
.recorrido button{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .6rem;border-radius:999px;border:1px solid var(--borde);background:var(--panel2);color:var(--texto);font:inherit;font-size:.82rem;cursor:pointer}
.recorrido button:hover{border-color:var(--acento);color:var(--acento)}
.recorrido button .n{display:inline-grid;place-items:center;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--borde);font-size:.72rem;font-weight:700}
.recorrido button.siguiente{border-color:var(--acento);background:var(--acento-fondo);color:var(--acento);font-weight:600}
.recorrido button.siguiente .n{background:var(--acento);color:var(--panel)}
.recorrido button.hecho{opacity:.6}
.recorrido .cerrar{margin-left:auto;border:none;background:none;padding:.1rem .4rem}
.lectura{border-left:4px solid var(--acento)}
.lectura ul{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.lectura li{display:flex;gap:.5rem;align-items:flex-start;font-size:.95rem}
.lectura li .punto{margin-top:.45rem;flex:none}
.grafo-caja{position:relative;height:520px;border:1px solid var(--borde);border-radius:.7rem;background:var(--panel2);overflow:hidden}
.grafo-caja svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.grafo-caja svg:active{cursor:grabbing}
.grafo-caja .arista{stroke:var(--suave);stroke-opacity:.35;stroke-width:1.2}
.grafo-caja .arista.activa{stroke:var(--acento);stroke-opacity:.9;stroke-width:2}
.grafo-caja .nodo circle{stroke:var(--panel);stroke-width:2;cursor:pointer}
.grafo-caja .nodo.paper circle{fill:var(--acento)}
.grafo-caja .nodo.concepto circle{fill:var(--wiki)}
.grafo-caja .nodo.nuevo .anillo{fill:none;stroke:var(--aviso);stroke-width:3;stroke-dasharray:4 3}
.grafo-caja .nodo text{font-size:11px;fill:var(--texto);pointer-events:none;paint-order:stroke;stroke:var(--panel2);stroke-width:3px}
.grafo-caja.enfoque .nodo,.grafo-caja.enfoque .arista{opacity:.15}
.grafo-caja.enfoque .nodo.vecino,.grafo-caja.enfoque .arista.activa{opacity:1}
.grafo-leyenda{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;font-size:.82rem;color:var(--suave);margin:.4rem 0 .5rem}
.grafo-leyenda i{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;margin-right:.3rem;vertical-align:-1px}
.duelo td.mejor,.tabla td.mejor{font-weight:700}
.duelo .gana{font-size:.75rem;color:var(--suave)}
.nota-pie{color:var(--suave);font-size:.88rem;margin-top:.7rem;max-width:56rem}

/* métricas */
.barra-h{display:inline-block;height:.55rem;border-radius:3px;vertical-align:middle;min-width:2px}
.barra-h.rag{background:var(--rag)}.barra-h.wiki{background:var(--wiki)}
.celdas{display:grid;gap:2px;font-size:.82rem}
.v-ok,.v-abst{color:var(--ok)}.v-mal{color:var(--error)}.v-ind{color:var(--aviso)}
.pill-v{display:inline-block;min-width:1.6rem;text-align:center;border-radius:.4rem;padding:0 .3rem;font-weight:700;cursor:help;border:1px solid currentColor}

/* dock: consola, llamadas, json */
.dock{margin-top:1rem;background:var(--term-fondo);border-radius:.9rem;overflow:hidden;border:1px solid var(--borde)}
.dock-cab{display:flex;gap:.3rem;align-items:center;padding:.35rem .5rem;border-bottom:1px solid #1e293b}
.dock-cab .tab{background:transparent;border:0;color:var(--term-suave);padding:.25rem .7rem;border-radius:.5rem}
.dock-cab .tab.activa{background:#1e293b;color:#e2e8f0}
.dock-cab .espacio{flex:1}
.dock-cab .boton{background:transparent;color:#cbd5e1;border-color:#334155;padding:.1rem .5rem;font-size:.8rem}
.dock-cuerpo{max-height:19rem;overflow:auto;padding:.5rem .8rem;color:var(--term-texto);font-size:.84rem}
.dock.grande .dock-cuerpo{max-height:none}
.dock.grande.solo{margin-top:0}
.dock-cuerpo .l{white-space:pre-wrap;word-break:break-word;min-height:1.2em}
.dock-cuerpo .l.comando{color:var(--term-cmd)}
.dock-cuerpo .l.error{color:var(--term-err)}
.dock-cuerpo .l.fin{color:var(--term-suave);margin-top:.3rem}
.dock-cuerpo table{width:100%;border-collapse:collapse;color:var(--term-texto)}
.dock-cuerpo th,.dock-cuerpo td{padding:.2rem .5rem;text-align:right;border-bottom:1px solid #1e293b;white-space:nowrap}
.dock-cuerpo th:first-child,.dock-cuerpo td:first-child{text-align:left}
.dock-cuerpo th{color:var(--term-suave);font-weight:600}
.dock-cuerpo .et-rag{color:#93c5fd}.dock-cuerpo .et-wiki{color:#6ee7b7}

/* visor */
#visor .cab{display:flex;gap:.5rem;align-items:center;padding:.55rem .8rem;border-bottom:1px solid var(--borde)}
#visor .cab .ruta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:.85rem ui-monospace,Consolas,monospace}
#visor .lista{padding:.6rem .8rem;overflow:auto;flex:1}
#visor input[type=search]{width:100%;border:1px solid var(--borde);background:var(--panel2);border-radius:.5rem;padding:.4rem .6rem;margin-bottom:.5rem}
#visor details{margin-bottom:.4rem}
#visor summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:.2rem 0}
.fila-archivo{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:.4rem;padding:.2rem .5rem;font:.82rem ui-monospace,Consolas,monospace}
.fila-archivo:hover{background:var(--acento-fondo)}
.contenido{flex:1;overflow:auto;padding:.9rem 1.1rem 2rem}
.contenido h2{font-size:1.25rem;margin:1.2rem 0 .4rem}.contenido h3{font-size:1.08rem;margin:1rem 0 .3rem}.contenido h4,.contenido h5{font-size:1rem;margin:.9rem 0 .3rem}
.contenido p{margin:.4rem 0}.contenido ul,.contenido ol{margin:.3rem 0;padding-left:1.4rem}
.contenido code{background:var(--panel2);border:1px solid var(--borde);border-radius:.25rem;padding:0 .25rem;font-size:.85em}
.contenido pre{background:var(--panel2);border:1px solid var(--borde);border-radius:.5rem;padding:.6rem;overflow:auto;font-size:.82rem}
.contenido pre code{border:0;background:transparent;padding:0}
.contenido table{border-collapse:collapse;margin:.5rem 0;font-size:.85rem}
.contenido th,.contenido td{border:1px solid var(--borde);padding:.25rem .5rem}
.contenido blockquote{margin:.4rem 0;padding-left:.8rem;border-left:3px solid var(--borde);color:var(--suave)}
.enlace-wiki{cursor:pointer;color:var(--wiki);text-decoration:none;border-bottom:1px dotted currentColor}
.meta-card{background:var(--wiki-fondo);border:1px solid var(--wiki-borde);border-radius:.7rem;padding:.6rem .8rem;margin-bottom:.8rem}
.meta-card b{display:block;font-size:1.05rem}
.codigo{font:.8rem/1.45 ui-monospace,Consolas,monospace}
.codigo .fila{display:flex}.codigo .n{flex:none;width:3rem;text-align:right;padding-right:.7rem;color:var(--suave);user-select:none}
.codigo .t{white-space:pre-wrap;word-break:break-word;flex:1}
.jsonl-fila{border-bottom:1px solid var(--borde);padding:.2rem 0}
.jsonl-fila summary{font-size:.85rem}
.jsonl-fila pre{margin:.3rem 0}

/* modal y avisos */
.velo{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;z-index:50;padding:1rem}
.dialogo{background:var(--panel);border:1px solid var(--borde);border-radius:1rem;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:1.1rem 1.3rem;width:min(34rem,100%);max-height:90vh;overflow:auto}
.dialogo h3{margin:0 0 .5rem;font-size:1.15rem}
.dialogo .pie{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.dialogo table{border-collapse:collapse;width:100%}.dialogo td{padding:.2rem .4rem;border-bottom:1px solid var(--borde)}
.dialogo td:first-child{white-space:nowrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;display:flex;flex-direction:column;gap:.4rem;z-index:60;align-items:center}
.toast{background:var(--texto);color:var(--bg);padding:.5rem .9rem;border-radius:.6rem;box-shadow:var(--sombra);max-width:32rem}
.toast.error{background:var(--error);color:#fff}
.lista-prep{list-style:none;margin:0;padding:0}.lista-prep li{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;border-bottom:1px solid var(--borde)}
.fila-form{display:flex;gap:.5rem}
.fila-form input{flex:1;border:1px solid var(--borde);background:var(--panel2);border-radius:.5rem;padding:.5rem .7rem;font-size:1.02rem}
.ejemplos{display:flex;flex-direction:column;gap:.35rem;margin-top:.7rem}
.ejemplos .etq{color:var(--suave);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.ejemplo{text-align:left;background:var(--panel2);border:1px solid var(--borde);border-radius:.6rem;padding:.4rem .7rem}
.ejemplo:hover{border-color:var(--acento)}
.ejemplo b{display:block;font-weight:600;font-size:.92rem}.ejemplo small{color:var(--suave)}
.progreso{height:.6rem;background:var(--borde);border-radius:999px;overflow:hidden}
.progreso i{display:block;height:100%;background:var(--wiki)}
.contenido-inline{max-height:28rem;overflow:auto}
.contenido-inline ul{padding-left:1.2rem}
#nav{width:14rem}
.comparacion+.acciones{margin-top:.9rem}
#presentacion{position:fixed;right:1rem;bottom:1rem;z-index:55;width:min(30rem,calc(100vw - 2rem));background:var(--panel);border:2px solid var(--acento);border-radius:.8rem;box-shadow:var(--sombra);padding:.8rem 1rem}
#presentacion .pres-cab{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.35rem}
#presentacion p{margin:.2rem 0 .6rem;line-height:1.45}
#presentacion .pres-barra{height:3px;background:var(--borde);border-radius:2px;overflow:hidden;margin-bottom:.6rem}
#presentacion .pres-barra i{display:block;height:100%;background:var(--acento);transition:width .3s}
.resaltado{outline:3px solid var(--acento);outline-offset:4px;border-radius:.6rem;transition:outline-color .3s}
.recorrido .pres-boton{margin-left:auto;background:var(--acento);color:#fff;border-color:var(--acento);font-weight:600}
.ancla-run:not(:empty) { margin-bottom: 1.2rem; }
</style>
</head>
<body>
<div id="app">
  <header id="barra"></header>
  <div id="cuerpo">
    <nav id="nav" aria-label="Secciones"></nav>
    <main id="principal"><div id="vista"></div><div id="principal-run"></div></main>
    <aside id="visor" hidden aria-label="Visor de archivos"></aside>
  </div>
</div>
<div id="modales"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const NUM = new Intl.NumberFormat('es-CO');
const num = (x) => (x == null ? '—' : NUM.format(x));
const dec = (x, d) => (x == null ? '—' : Number(x).toLocaleString('es-CO', {minimumFractionDigits: d, maximumFractionDigits: d}));
const usd = (x, d = 6) => dec(x, d);
const seg = (x) => (x == null ? '—' : dec(x, 1) + ' s');
const mmss = (s) => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const minseg = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function h(tag, props, ...hijos) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'texto') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const hijo of hijos.flat(Infinity)) {
    if (hijo == null || hijo === false) continue;
    el.append(hijo.nodeType ? hijo : document.createTextNode(String(hijo)));
  }
  return el;
}
function poner(el, ...nodos) {
  el.replaceChildren(...nodos.flat(Infinity).filter((n) => n != null && n !== false));
}
const chip = (texto, clase = '', titulo) => h('span', {class: 'chip ' + clase, title: titulo}, texto);

const pref = {
  get(k, d) { try { const v = localStorage.getItem('panel.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('panel.' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};

async function api(ruta, opciones) {
  let r;
  try { r = await fetch(ruta, opciones); } catch (e) { throw new Error('No hay conexión con el panel'); }
  let cuerpo = null;
  try { cuerpo = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) throw Object.assign(new Error((cuerpo && cuerpo.error) || 'Error ' + r.status), {estado: r.status});
  return cuerpo;
}
const post = (ruta, cuerpo) => api(ruta, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cuerpo)});

function toast(texto, tipo = '', ms = 4500) {
  const t = h('div', {class: 'toast ' + tipo, texto});
  $('#toasts').append(t);
  setTimeout(() => t.remove(), ms);
}
function copiar(texto, aviso = 'Copiado') {
  const listo = () => toast(aviso);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(listo, () => toast('No se pudo copiar', 'error'));
  else toast('El navegador no permite copiar aquí', 'error');
}
function fechaCorta(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('es-CO', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false});
}

/* ================= estado ================= */
const S = {
  acciones: {}, estado: null, ejemplos: [], archivos: [], rutasPermitidas: new Set(),
  vista: 'preguntar', run: null, es: null, metricas: null, indiceWiki: null,
  dock: 'consola', dockGrande: false, pregunta: '', pendiente: false, pegado: true,
  historial: [], rutaVisor: null, firmaBarra: '',
};
const hayModal = () => $('#modales').children.length > 0;

/* ================= modal ================= */
function modal({titulo, cuerpo, botones}) {
  return new Promise((resolver) => {
    const previo = document.activeElement;
    const cerrar = (valor) => { velo.remove(); document.removeEventListener('keydown', alTecla, true); if (previo && previo.focus) previo.focus(); resolver(valor); };
    const alTecla = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cerrar(null); }
      if (e.key === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) { const p = botones.find((b) => b.primario); if (p) { e.preventDefault(); e.stopPropagation(); cerrar(p.valor); } }
    };
    const pie = h('div', {class: 'pie'}, botones.map((b) => h('button', {class: 'boton ' + (b.clase || (b.primario ? 'primario' : '')), onclick: () => cerrar(b.valor)}, b.texto)));
    const velo = h('div', {class: 'velo', onclick: (e) => { if (e.target === velo) cerrar(null); }},
      h('div', {class: 'dialogo', role: 'dialog', 'aria-modal': 'true', 'aria-label': titulo}, h('h3', {texto: titulo}), typeof cuerpo === 'function' ? cuerpo(cerrar) : cuerpo, pie));
    $('#modales').append(velo);
    document.addEventListener('keydown', alTecla, true);
    const foco = pie.querySelector('.primario') || pie.querySelector('button');
    if (foco) foco.focus();
  });
}

/* ================= markdown seguro (solo DOM) ================= */
const RE_INLINE = /`([^`]+)`|\*\*([^*]+)\*\*|\[\[([^\]]+)\]\]|\[([^\]\[]+)\]\(([^)\s]+)\)|\[([^\]\[#\s]+#[^\]\[\s]+)\]|(?<![*\w])\*([^*\s][^*]*?)\*(?![*\w])/g;
function chipCita(id) {
  return h('span', {class: 'cita-chip', title: 'Identificador del fragmento citado (clic para copiar)', onclick: () => copiar(id, 'Identificador copiado')}, id);
}
function inline(texto, ctx) {
  const frag = document.createDocumentFragment();
  const re = new RegExp(RE_INLINE.source, 'g');
  let ultimo = 0, m;
  while ((m = re.exec(texto))) {
    if (m.index > ultimo) frag.append(texto.slice(ultimo, m.index));
    if (m[1] !== undefined) frag.append(h('code', {texto: m[1]}));
    else if (m[2] !== undefined) frag.append(h('strong', {texto: m[2]}));
    else if (m[3] !== undefined) frag.append(enlaceWiki(m[3], ctx));
    else if (m[4] !== undefined) frag.append(enlaceMd(m[4], m[5], ctx));
    else if (m[6] !== undefined) frag.append(chipCita(m[6]));
    else frag.append(h('em', {texto: m[7]}));
    ultimo = re.lastIndex;
  }
  if (ultimo < texto.length) frag.append(texto.slice(ultimo));
  return frag;
}
function enlaceWiki(slug, ctx) {
  const ruta = (ctx && ctx.carpetaPaginas ? ctx.carpetaPaginas : 'data/wiki/demo/pages/') + slug + '.md';
  return h('a', {class: 'enlace-wiki', href: '#', title: 'Abrir ' + ruta, onclick: (e) => { e.preventDefault(); abrirArchivo(ruta); }}, slug);
}
function resolverRelativa(base, destino) {
  const partes = base.split('/').slice(0, -1);
  for (const p of destino.split('/')) { if (p === '..') partes.pop(); else if (p !== '.') partes.push(p); }
  return partes.join('/');
}
function enlaceMd(texto, url, ctx) {
  if (!/^[a-z]+:/i.test(url) && /\.md(#.*)?$/.test(url) && ctx && ctx.ruta) {
    const ruta = resolverRelativa(ctx.ruta, url.split('#')[0]);
    if (S.rutasPermitidas.has(ruta)) return h('a', {href: '#', onclick: (e) => { e.preventDefault(); abrirArchivo(ruta); }}, texto);
  }
  return h('span', {class: 'enlace-ext', title: url}, texto);
}
function metaDeCabecera(lineas) {
  const datos = {}; let clave = null;
  for (const l of lineas) {
    let m;
    if ((m = /^(\w+):\s*(.*)$/.exec(l))) { clave = m[1]; datos[clave] = m[2] === '' ? [] : m[2]; }
    else if ((m = /^-\s+(.*)$/.exec(l)) && clave) { if (!Array.isArray(datos[clave])) datos[clave] = []; datos[clave].push(m[1].replace(/^'(.*)'$/, '$1')); }
    else if (/^\s+\S/.test(l) && clave && typeof datos[clave] === 'string') datos[clave] += ' ' + l.trim();
  }
  for (const k of Object.keys(datos)) if (typeof datos[k] === 'string') datos[k] = datos[k].replace(/^'([\s\S]*)'$/, '$1').replace(/''/g, "'");
  return datos;
}
function tarjetaMeta(lineas) {
  const d = metaDeCabecera(lineas);
  return h('div', {class: 'meta-card'},
    h('b', {texto: d.titulo || 'Página del wiki'}),
    h('div', null, d.tipo ? chip(d.tipo, 'wiki') : null, ' ', d.actualizada_en_paso ? chip('actualizada en el paso ' + d.actualizada_en_paso) : null,
      ' ', Array.isArray(d.fuentes) ? d.fuentes.map((f) => chip('fuente ' + f, 'acento')) : null),
    d.resumen ? h('p', {texto: d.resumen}) : null);
}
function renderMarkdown(texto, ctx) {
  const raiz = document.createDocumentFragment();
  let l = texto.replace(/\r\n/g, '\n').split('\n');
  if (l[0] === '---') { const fin = l.indexOf('---', 1); if (fin > 0) { raiz.append(tarjetaMeta(l.slice(1, fin))); l = l.slice(fin + 1); } }
  const inicioDeBloque = (x) => /^(#{1,4}\s|```|\s*[-*]\s+|\s*\d+\.\s+|>|\|)/.test(x) || /^---+$/.test(x.trim());
  let i = 0;
  while (i < l.length) {
    const x = l[i]; let m;
    if (!x.trim()) { i++; continue; }
    if (/^```/.test(x)) {
      const buf = []; i++;
      while (i < l.length && !/^```/.test(l[i])) buf.push(l[i++]);
      i++; raiz.append(h('pre', null, h('code', {texto: buf.join('\n')}))); continue;
    }
    if ((m = /^(#{1,4})\s+(.*)$/.exec(x))) { raiz.append(h('h' + (m[1].length + 1), null, inline(m[2], ctx))); i++; continue; }
    if (/^---+$/.test(x.trim())) { raiz.append(h('hr')); i++; continue; }
    if (/^\s*[-*]\s+/.test(x) || /^\s*\d+\.\s+/.test(x)) {
      const ordenada = /^\s*\d+\./.test(x), items = [];
      while (i < l.length && (/^\s*[-*]\s+/.test(l[i]) || /^\s*\d+\.\s+/.test(l[i]))) {
        const sangria = /^\s*/.exec(l[i])[0].length;
        items.push(h('li', {style: sangria >= 2 ? 'margin-left:' + Math.min(sangria, 8) * 0.5 + 'rem' : null}, inline(l[i].replace(/^\s*([-*]|\d+\.)\s+/, ''), ctx)));
        i++;
      }
      raiz.append(h(ordenada ? 'ol' : 'ul', null, items)); continue;
    }
    if (x.trim().startsWith('|') && i + 1 < l.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l[i + 1])) {
      const celdas = (f) => f.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const cab = celdas(x); i += 2; const filas = [];
      while (i < l.length && l[i].trim().startsWith('|')) filas.push(celdas(l[i++]));
      raiz.append(h('table', null, h('thead', null, h('tr', null, cab.map((c) => h('th', null, inline(c, ctx))))),
        h('tbody', null, filas.map((f) => h('tr', null, f.map((c) => h('td', null, inline(c, ctx))))))));
      continue;
    }
    if (x.startsWith('>')) {
      const buf = [];
      while (i < l.length && l[i].startsWith('>')) buf.push(l[i++].replace(/^>\s?/, ''));
      raiz.append(h('blockquote', null, inline(buf.join(' '), ctx))); continue;
    }
    const buf = [x]; i++;
    while (i < l.length && l[i].trim() && !inicioDeBloque(l[i])) buf.push(l[i++]);
    raiz.append(h('p', null, inline(buf.join(' '), ctx)));
  }
  return raiz;
}

/* ================= visor de archivos ================= */
function carpetaDePaginas(ruta) {
  const m = /^(data\/wiki\/[^/]+)\//.exec(ruta);
  return m ? m[1] + '/pages/' : 'data/wiki/demo/pages/';
}
async function abrirArchivo(ruta, sinHistorial) {
  mostrarVisor(true);
  try {
    const d = await api('/api/archivo?ruta=' + encodeURIComponent(ruta));
    if (!sinHistorial && S.rutaVisor && S.rutaVisor !== ruta) S.historial.push(S.rutaVisor);
    S.rutaVisor = ruta; renderVisor(d);
  } catch (e) { toast(e.message, 'error'); }
}
function mostrarVisor(si) {
  const v = $('#visor'); v.hidden = si === undefined ? !v.hidden : !si;
  pref.set('visor', !v.hidden);
  if (!v.hidden && !S.rutaVisor) renderVisor(null);
}
function renderLista(filtro) {
  const grupos = new Map();
  for (const a of S.archivos) {
    if (filtro && !a.ruta.toLowerCase().includes(filtro.toLowerCase())) continue;
    if (!grupos.has(a.grupo)) grupos.set(a.grupo, []);
    grupos.get(a.grupo).push(a);
  }
  const nodos = [];
  for (const [g, lista] of grupos) {
    nodos.push(h('details', {open: !!filtro || g === 'Wiki de la demostración' || g === 'Evidencia'}, h('summary', {texto: g + ' (' + lista.length + ')'}),
      lista.map((a) => h('button', {class: 'fila-archivo', title: a.ruta, onclick: () => abrirArchivo(a.ruta)}, a.ruta))));
  }
  return nodos.length ? nodos : [h('p', {class: 'detalle', texto: 'Ningún archivo coincide.'})];
}
function renderVisor(d) {
  const v = $('#visor');
  const cabecera = h('div', {class: 'cab'},
    h('button', {class: 'boton chico', title: 'Volver al archivo anterior', disabled: !S.historial.length, onclick: () => { const r = S.historial.pop(); if (r) abrirArchivo(r, true); }}, '←'),
    h('button', {class: 'boton chico', title: 'Lista de archivos', onclick: () => { S.rutaVisor = null; renderVisor(null); }}, '☰'),
    h('span', {class: 'ruta', title: d ? d.ruta : ''}, d ? d.ruta : 'Archivos'),
    d ? h('button', {class: 'boton chico', title: 'Copiar la ruta', onclick: () => copiar(d.ruta, 'Ruta copiada')}, 'Copiar ruta') : null,
    h('button', {class: 'boton chico', title: 'Cerrar (A)', onclick: () => mostrarVisor(false)}, '✕'));
  if (!d) {
    const lista = h('div', null, renderLista(''));
    const buscar = h('input', {type: 'search', placeholder: 'Filtrar archivos…', 'aria-label': 'Filtrar archivos', oninput: () => lista.replaceChildren(...renderLista(buscar.value))});
    v.replaceChildren(cabecera, h('div', {class: 'lista'}, buscar, lista));
    return;
  }
  const info = h('div', {class: 'detalle', style: 'margin-bottom:.6rem'}, chip(d.tipo), ' ', chip(num(d.bytes) + ' bytes'), d.truncado ? [' ', chip('truncado: se muestra el comienzo', 'aviso')] : null);
  const ctx = {ruta: d.ruta, carpetaPaginas: carpetaDePaginas(d.ruta)};
  let cuerpo;
  if (d.tipo === 'markdown') cuerpo = h('div', null, renderMarkdown(d.texto, ctx));
  else if (d.tipo === 'json') { let t = d.texto; try { t = JSON.stringify(JSON.parse(d.texto), null, 2); } catch (e) { /* truncado */ } cuerpo = h('pre', null, h('code', {texto: t})); }
  else if (d.tipo === 'jsonl') cuerpo = vistaJsonl(d.texto);
  else cuerpo = vistaCodigo(d.texto);
  v.replaceChildren(cabecera, h('div', {class: 'contenido'}, info, cuerpo));
}
function vistaCodigo(texto) {
  return h('div', {class: 'codigo'}, texto.split('\n').map((t, i) => h('div', {class: 'fila'}, h('span', {class: 'n', texto: i + 1}), h('span', {class: 't', texto: t}))));
}
function resumenJsonl(o) {
  const claves = ['timestamp', 'question_id', 'pregunta', 'system', 'sistema', 'ingest_step', 'paso', 'run_id', 'id', 'arxiv_id', 'momento', 'etiqueta'];
  const partes = claves.filter((k) => o[k] !== undefined && typeof o[k] !== 'object').map((k) => o[k]);
  const t = partes.join(' · ');
  return t || JSON.stringify(o).slice(0, 120);
}
function vistaJsonl(texto) {
  const lineas = texto.split('\n').filter((x) => x.trim());
  const tope = 300;
  const filas = lineas.slice(0, tope).map((x, i) => {
    let o = null; try { o = JSON.parse(x); } catch (e) { /* línea cortada */ }
    return h('details', {class: 'jsonl-fila'}, h('summary', {texto: (i + 1) + '. ' + (o ? resumenJsonl(o) : x.slice(0, 120))}),
      h('pre', null, h('code', {texto: o ? JSON.stringify(o, null, 2) : x})));
  });
  return h('div', null, h('p', {class: 'detalle', texto: lineas.length + ' líneas' + (lineas.length > tope ? '; se muestran las primeras ' + tope : '')}), filas);
}
function chipArchivo(ruta, texto) {
  const existe = S.rutasPermitidas.has(ruta);
  return h('button', {class: 'chip chip-archivo', disabled: !existe, title: existe ? 'Abrir ' + ruta : 'No existe en esta máquina: ' + ruta, onclick: () => abrirArchivo(ruta)}, texto || ruta.split('/').pop());
}

/* ================= secciones ================= */
const VISTAS = [
  ['preguntar', 'Preguntar', 'Los dos sistemas, misma pregunta'],
  ['ingerir', 'Ingerir', 'Añadir papers al wiki'],
  ['wiki', 'Wiki', 'Lo que el agente escribió'],
  ['resultados', 'Resultados', 'Métricas y costo'],

/* ================= grafo del wiki (vista tipo Obsidian) ================= */
// Built client-side from the page files: [[slug]] links are the edges, the frontmatter gives the
// page type and the last ingestion step that touched it. No external library, so it works offline.
const SVG_NS = 'http://www.w3.org/2000/svg', GW = 1100, GH = 520;
function sv(tag, attrs, ...hijos) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  hijos.flat().forEach((x) => x && el.append(x));

}
function frontmatter(texto) {

}
async function cargarGrafo(ingeridos) {
  // Ask for a fresh file list: S.archivos refreshes every 5 s and may not yet hold the pages
  // that the last ingestion created, and the graph is cached per ingestion step.
  let archivos = S.archivos || [];
  try { archivos = await api('/api/archivos'); S.archivos = archivos; S.rutasPermitidas = new Set(archivos.map((a) => a.ruta)); } catch (e) { /* keep the cached list */ }
  const rutas = archivos.map((a) => a.ruta).filter((r) => r.startsWith(WIKI + '/pages/') && r.endsWith('.md'));
  const paginas = await Promise.all(rutas.map(async (ruta) => {
    try { return {ruta, texto: (await api('/api/archivo?ruta=' + encodeURIComponent(ruta))).texto}; } catch (e) { return null; }
  }));
  const nodos = [], porSlug = {};
  for (const p of paginas.filter(Boolean)) {
    const slug = p.ruta.split('/').pop().replace(/\.md$/, ''), fm = frontmatter(p.texto);
    const enlaces = [...new Set([...p.texto.matchAll(/\[\[([^\]|#]+)/g)].map((x) => x[1].trim()))];
    const n = {slug, ruta: p.ruta, tipo: fm.tipo === 'paper' ? 'paper' : 'concepto', titulo: fm.titulo || slug, paso: fm.paso, enlaces, grado: 0};
    nodos.push(n); porSlug[slug] = n;
  }
  const aristas = [], vistas = new Set();
  for (const n of nodos) for (const destino of n.enlaces) {
    const clave = [n.slug, destino].sort().join('|');
    if (porSlug[destino] && destino !== n.slug && !vistas.has(clave)) { vistas.add(clave); aristas.push({a: n, b: porSlug[destino]}); n.grado++; porSlug[destino].grado++; }
  }
  const previo = S.grafo && S.grafo.porSlug;  // keep positions so a repaint does not reshuffle the layout
  nodos.forEach((n, i) => {
    const p = previo && previo[n.slug];
    const ang = (i / nodos.length) * Math.PI * 2;
    n.x = p ? p.x : GW / 2 + Math.cos(ang) * 300; n.y = p ? p.y : GH / 2 + Math.sin(ang) * 200; n.vx = 0; n.vy = 0;

}

    if (!S.cargandoGrafo) { S.cargandoGrafo = true; cargarGrafo(w.ingeridos).finally(() => { S.cargandoGrafo = false; }); }
    caja.append(h('div', {class: 'vacio', texto: 'Construyendo el grafo del wiki…'}));
  } else {
    dibujarGrafo(caja, g, w.ingeridos);
  }
  const nuevos = g ? g.nodos.filter((n) => n.paso === w.ingeridos).length : 0;
  return h('section', {class: 'comparacion'},
    h('h4', {texto: 'Grafo del wiki: páginas y enlaces'}),
    h('div', {class: 'grafo-leyenda'},
      h('span', null, h('i', {style: 'background:var(--acento)'}), 'página de un paper'),
      h('span', null, h('i', {style: 'background:var(--wiki)'}), 'página de un concepto'),
      h('span', null, h('i', {style: 'border:2px dashed var(--aviso);background:none'}), 'tocada en la última ingesta (paso ' + w.ingeridos + ')' + (g ? ': ' + nuevos : '')),
      g ? h('span', {texto: g.nodos.length + ' páginas · ' + g.aristas.length + ' enlaces'}) : null,
      h('span', {texto: 'Arrastra los nodos; clic para abrir la página.'})),
    caja);
}
function dibujarGrafo(caja, g, ingeridos) {
  const svg = sv('svg', {viewBox: '0 0 ' + GW + ' ' + GH, role: 'img', 'aria-label': 'Grafo de páginas del wiki'});
  const capaA = sv('g'), capaN = sv('g');
  svg.append(capaA, capaN);
  const lineas = g.aristas.map((e) => { const l = sv('line', {class: 'arista'}); capaA.append(l); return l; });
  const radio = (n) => 6 + Math.sqrt(n.grado) * 3;
  const elems = g.nodos.map((n) => {
    const r = radio(n);
    const corto = n.titulo.length > 34 ? n.titulo.slice(0, 32) + '…' : n.titulo;
    const el = sv('g', {class: 'nodo ' + n.tipo + (n.paso === ingeridos ? ' nuevo' : '')},
      n.paso === ingeridos ? sv('circle', {class: 'anillo', r: r + 5}) : null,
      sv('circle', {r}), sv('text', {x: r + 4, y: 4}, corto), sv('title', null, n.titulo + ' · ' + n.grado + ' enlaces · actualizada en el paso ' + n.paso));
    capaN.append(el);
    return el;

  // Hover: highlight the node, its neighbours and the edges between them.
  const vecinos = (n) => new Set([n, ...g.aristas.filter((e) => e.a === n || e.b === n).flatMap((e) => [e.a, e.b])]);
  g.nodos.forEach((n, i) => {
    elems[i].addEventListener('pointerenter', () => {
      const v = vecinos(n); caja.classList.add('enfoque');
      g.nodos.forEach((m, j) => elems[j].classList.toggle('vecino', v.has(m)));

  });
  // Drag a node, or click it to open the page in the file viewer.
  let arrastre = null;
  const punto = (ev) => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  g.nodos.forEach((n, i) => elems[i].addEventListener('pointerdown', (ev) => { arrastre = {n, movio: false}; svg.setPointerCapture(ev.pointerId); calor = 1; }));
  svg.addEventListener('pointermove', (ev) => { if (!arrastre) return; const p = punto(ev); arrastre.n.x = p.x; arrastre.n.y = p.y; arrastre.movio = true; calor = Math.max(calor, 0.5); });

  // Small force simulation: node repulsion, springs on the links and a pull to the centre.
  let calor = 1;
  function paso() {
    if (!caja.isConnected) return;  // the view was repainted: stop this simulation
    if (calor > 0.02) {
      const ns = g.nodos;
      for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
        const a = ns[i], b = ns[j]; let dx = a.x - b.x, dy = a.y - b.y; const d2 = Math.max(dx * dx + dy * dy, 25);
        const f = 9000 / d2, d = Math.sqrt(d2); dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
      for (const e of g.aristas) {
        const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 150) * 0.015;
        e.a.vx += dx / d * f; e.a.vy += dy / d * f; e.b.vx -= dx / d * f; e.b.vy -= dy / d * f;
      }
      for (const n of ns) {
        n.vx += (GW / 2 - n.x) * 0.0015; n.vy += (GH / 2 - n.y) * 0.003;
        if (arrastre && arrastre.n === n) { n.vx = 0; n.vy = 0; continue; }
        n.x += n.vx * calor; n.y += n.vy * calor; n.vx *= 0.6; n.vy *= 0.6;
        n.x = Math.min(GW - 230, Math.max(20, n.x)); n.y = Math.min(GH - 20, Math.max(20, n.y));
      }
      calor *= 0.985;
    }
    g.aristas.forEach((e, j) => { const l = lineas[j]; l.setAttribute('x1', e.a.x); l.setAttribute('y1', e.a.y); l.setAttribute('x2', e.b.x); l.setAttribute('y2', e.b.y); });
    g.nodos.forEach((n, i) => elems[i].setAttribute('transform', 'translate(' + n.x.toFixed(1) + ',' + n.y.toFixed(1) + ')'));
    requestAnimationFrame(paso);
  }
  caja.append(svg);
  requestAnimationFrame(paso);
}

// Waits ms of unpaused time; the view re-renders every few seconds, so the highlight is re-applied.

/* ================= ejecución y flujo de eventos ================= */
function iniciarRun(accion, titulo, id, repro, parametros) {
  cerrarFlujo();
  S.run = {id, accion, titulo, params: parametros || {}, repro, reproInfo: null, estado: 'corriendo', codigo: null, lineas: [], llamadas: [], resultado: null, errores: [], activo: null, fase: '', segundos: null, comando: null};
  S.dock = 'consola'; S.dockGrande = false; S.pegado = true;
  if (vistaDeAccion(accion) !== S.vista) cambiarVista(vistaDeAccion(accion)); else renderVista();
  // The output renders below the view (under the whole metrics table in Results): bring it into sight.
  requestAnimationFrame(() => { const c = $('#vista .ancla-run') || $('#principal-run'); if (c && c.firstChild) c.scrollIntoView({behavior: 'smooth', block: 'nearest'}); });
  const run = S.run;
  const es = new EventSource('/api/eventos/' + id);
  S.es = es;
  es.onmessage = (m) => { let ev; try { ev = JSON.parse(m.data); } catch (e) { return; } alEvento(run, ev); };
  es.onerror = () => { if (run.estado === 'corriendo' && es.readyState === EventSource.CLOSED) { run.estado = 'error'; run.errores.push('Se perdió la conexión con el panel'); programarPintado(); } };
}
function cerrarFlujo() { if (S.es) { S.es.close(); S.es = null; } }
function alEvento(run, ev) {
  if (ev.repro) run.repro = true;
  switch (ev.t) {
    case 'repro': run.repro = true; run.reproInfo = {grabacion: ev.grabacion, fecha: ev.fecha}; break;
    case 'linea': {
      run.lineas.push({texto: ev.texto, canal: ev.canal || ''});
      if (ev.canal === 'comando') run.comando = ev.texto;
      const m = /^Preguntando al brazo (\w+)/.exec(ev.texto || '');
      if (m) { run.activo = m[1]; run.fase = 'Preguntando al ' + (m[1] === 'rag' ? 'RAG' : 'WikiLLM'); }
      const p = /^Poniendo el brazo (\w+) en el paso (\d+)/.exec(ev.texto || '');
      if (p) run.fase = 'Poniendo el ' + (p[1] === 'rag' ? 'RAG' : 'wiki') + ' en el paso ' + p[2];
      break;
    }
    case 'llamando': run.llamadas.push({etiqueta: ev.etiqueta, estado: 'curso', t0: Date.now()}); if (ev.etiqueta === 'rag' || ev.etiqueta === 'wiki') run.activo = ev.etiqueta; break;
    case 'llamada': {
      const l = [...run.llamadas].reverse().find((x) => x.etiqueta === ev.etiqueta && x.estado === 'curso') || (run.llamadas.push({etiqueta: ev.etiqueta, t0: Date.now()}), run.llamadas[run.llamadas.length - 1]);
      Object.assign(l, {estado: 'ok', entrada: ev.tokens_entrada, cache: ev.tokens_cache, salida: ev.tokens_salida, segundos: ev.segundos, usd: ev.usd, texto: ev.texto});
      if (!ev.repro && S.estado) S.estado.gasto.sesion_usd += ev.usd || 0;
      break;
    }
    case 'llamada_fallida': {
      const l = [...run.llamadas].reverse().find((x) => x.etiqueta === ev.etiqueta && x.estado === 'curso');
      if (l) Object.assign(l, {estado: 'fallo', motivo: ev.motivo});
      run.errores.push('La llamada «' + ev.etiqueta + '» falló: ' + ev.motivo);
      break;
    }
    case 'resultado': run.resultado = ev; break;
    case 'error': run.errores.push(ev.mensaje); break;
    case 'fin':
      run.estado = ev.codigo === 0 ? 'ok' : 'error'; run.codigo = ev.codigo; run.segundos = ev.segundos; run.activo = null;
      cerrarFlujo();
      if (run.accion === 'ingerir') S.indiceWiki = null;
      refrescarEstado().then(() => { if (run.accion === 'reiniciar_wiki' || run.accion === 'ingerir') S.indiceWiki = null; renderVista(); });
      break;
    default: break;
  }
  programarPintado();
}
function programarPintado() {
  if (S.pendiente) return;
  S.pendiente = true;
  requestAnimationFrame(() => { S.pendiente = false; renderRun(); actualizarGasto(); });
}

/* ================= vista de la ejecución ================= */
function renderRun() {
  // A view may reserve a slot right under its buttons (Results does: its table is long).
  const ancla = $('#vista .ancla-run'), fondo = $('#principal-run');

  if (vistaDeAccion(run.accion) !== S.vista) {
    poner(cont, run.estado === 'corriendo' ? h('div', {class: 'vacio'}, 'En curso: ' + run.titulo + '. ', h('button', {class: 'boton chico', onclick: () => cambiarVista(vistaDeAccion(run.accion))}, 'Ver')) : null);
    return;
  }
  const partes = [];
  const e = run.estado;
  partes.push(h('div', {class: 'estado-run'},
    h('h3', {texto: run.titulo}),
    e === 'corriendo' ? h('span', {class: 'chip acento'}, h('span', {class: 'girando'}), ' ' + (run.fase || 'ejecutando…')) : e === 'ok' ? chip('terminó bien · ' + seg(run.segundos), 'ok') : chip('terminó con error (código ' + run.codigo + ')', 'error'),
    run.comando ? h('button', {class: 'boton chico', title: 'Copia la orden equivalente de la consola', onclick: () => copiar(run.comando, 'Orden copiada')}, 'Copiar la orden de la consola') : null));
  if (run.repro) partes.push(h('div', {class: 'aviso-repro', role: 'status'}, 'REPRODUCCIÓN de una ejecución guardada' + (run.reproInfo && run.reproInfo.fecha ? ' (' + fechaCorta(run.reproInfo.fecha) + ')' : '') + '. No es una ejecución en vivo: no se llamó al modelo.'));
  for (const m of run.errores) partes.push(h('div', {class: 'aviso-error', role: 'alert', texto: m}));
  const estructurada = run.accion === 'comparar' || run.accion === 'ingerir';
  if (run.accion === 'comparar') partes.push(vistaComparacion(run));

  partes.push(dock(run, !estructurada));
  cont.replaceChildren(...partes);
  const cuerpoDock = cont.querySelector('.dock-cuerpo');
  if (cuerpoDock && S.pegado !== false) cuerpoDock.scrollTop = cuerpoDock.scrollHeight;
}

/* --- comparación --- */
function parsearAccion(texto) {
  let o = null;
  try { o = JSON.parse(texto); } catch (e) { /* texto recortado: se lee a mano */ }
  if (o && typeof o === 'object') return {accion: String(o.action || '').toLowerCase(), arg: o.query || o.pages || (o.answer ? '' : '')};
  const a = /"action"\s*:\s*"(\w+)"/.exec(texto || ''); const q = /"query"\s*:\s*"([^"]*)/.exec(texto || '');
  const p = /"pages"\s*:\s*\[([^\]]*)/.exec(texto || '');
  return {accion: a ? a[1].toLowerCase() : '', arg: q ? q[1] : p ? p[1].replace(/["\s]/g, '').split(',').filter(Boolean) : ''};
}
const VERBO = {search: 'Buscar', read: 'Leer', answer: 'Responder'};
function paginasChips(slugs, carpeta) {
  return h('div', {class: 'paginas'}, slugs.map((s) => chipArchivo(s === 'index' ? carpeta.replace(/pages\/$/, '') + 'index.md' : carpeta + s + '.md', s)));

  const tabla = h('table', {class: 'tabla'}, h('thead', null, h('tr', null, ['paso', 'sistema', 'respondibles', 'cobertura', 'abstención correcta', 'fundamentación', 'contexto medio (tokens)', 'USD'].map((x) => h('th', {texto: x})))),
    h('tbody', null, filas.map((f) => h('tr', null, h('td', {texto: f.ingest_step}), h('td', {class: f.system, texto: f.system === 'rag' ? 'RAG simple' : 'WikiLLM'}), h('td', {texto: f.n_respondibles + ' de ' + f.n}),
      h('td', null, barra(f.cobertura, f.system)), h('td', null, barra(f.abstencion_correcta, f.system)), h('td', null, barra(f.fundamentacion_media, f.system)), h('td', {texto: f.context_tokens_media == null ? '—' : num(Math.round(f.context_tokens_media))}), h('td', {texto: usd(f.costo_usd_total, 4)})))));
  const ids = [...new Set(m.preguntas.map((q) => q.id))];
  const col = [[0, 'rag'], [0, 'wiki'], [5, 'rag'], [5, 'wiki']];
  const pasos = [...new Set(m.preguntas.map((q) => q.paso))].sort((a, b) => a - b);
  const columnas = pasos.flatMap((p) => ['rag', 'wiki'].map((s) => [p, s]));
  const grid = h('table', {class: 'tabla'}, h('thead', null, h('tr', null, h('th', {texto: 'pregunta'}), h('th', {texto: 'tipo'}), columnas.map(([p, s]) => h('th', {class: s, texto: (s === 'rag' ? 'RAG' : 'Wiki') + ' · paso ' + p})))),
    h('tbody', null, ids.map((id) => {
      const qs = m.preguntas.filter((q) => q.id === id), primera = qs[0];
      return h('tr', null, h('td', {title: primera.texto, style: 'max-width:26rem;overflow:hidden;text-overflow:ellipsis', texto: id + ' · ' + (primera.texto || '').slice(0, 70)}), h('td', {texto: primera.tipo || ''}),
        columnas.map(([p, s]) => {
          const q = qs.find((x) => x.paso === p && x.sistema === s);
          if (!q) return h('td', {texto: '—'});
          const [sim, cl, desc] = VEREDICTO[claveVeredicto(q)] || ['?', 'v-ind', ''];
          return h('td', null, h('span', {class: 'pill-v ' + cl, title: desc + ' · ' + (q.respuesta || '').slice(0, 220), texto: sim}));
        }));
    })));
  return h('div', null,
    h('div', {class: 'estado-run'}, h('h3', {texto: 'Piloto ' + (c.corrida || '')}), chip((c.preguntas || '?') + ' preguntas × ' + pasos.length + ' pasos × 2 sistemas'), chip(c.modelo || ''),
      c.valida_para_informe === false ? chip('No vale para el informe: n pequeño y preguntas sin acordar', 'aviso') : null),
    dueloMetricas(filas),
    h('section', {class: 'comparacion'}, h('h4', {texto: 'Métricas por sistema y paso'}), tabla,
      h('p', {class: 'nota-pie', texto: 'Cobertura: proporción de las preguntas respondibles que el sistema acierta. Con pocas preguntas respondibles en el paso 5, estas cifras solo muestran que la cadena de evaluación funciona de punta a punta.'})),
    h('section', {class: 'comparacion'}, h('h4', {texto: 'Veredicto por pregunta (✓ acierta · ○ se abstiene bien · ✗ falla · ? indeterminada)'}), grid));
}

/* --- dock: consola, llamadas, json --- */
function dock(run, solo) {
  const grande = solo || S.dockGrande;
  const tabs = [['consola', 'Consola'], ['llamadas', 'Llamadas al modelo (' + run.llamadas.length + ')'], ['json', 'Resultado en JSON']];
  const cuerpo = h('div', {class: 'dock-cuerpo mono', onscroll: (e) => { const t = e.target; S.pegado = t.scrollHeight - t.scrollTop - t.clientHeight < 30; }});
  if (S.dock === 'consola' || solo) {
    for (const l of run.lineas) cuerpo.append(h('div', {class: 'l ' + (l.canal || ''), texto: (l.canal === 'comando' ? '$ ' : '') + l.texto}));
    if (run.estado !== 'corriendo') cuerpo.append(h('div', {class: 'l fin', texto: '— terminó con código ' + run.codigo + (run.repro ? ' (reproducción)' : '') + ' —'}));
  } else if (S.dock === 'llamadas') {
    let acumulado = 0;
    const et = (e) => h('span', {class: /^rag/.test(e) ? 'et-rag' : 'et-wiki', texto: e});
    cuerpo.append(h('table', null, h('thead', null, h('tr', null, ['#', 'etiqueta', 'entrada', 'de caché', 'salida', 'segundos', 'USD', 'acumulado'].map((x) => h('th', {texto: x})))),
      h('tbody', null, run.llamadas.map((l, i) => { acumulado += l.usd || 0; return h('tr', null, h('td', {texto: i + 1}), h('td', null, et(l.etiqueta)),
        h('td', {texto: l.estado === 'ok' ? num(l.entrada) : l.estado === 'fallo' ? 'falló' : '…'}), h('td', {texto: l.estado === 'ok' ? num(l.cache) : ''}), h('td', {texto: l.estado === 'ok' ? num(l.salida) : ''}),
        h('td', {texto: l.estado === 'ok' ? dec(l.segundos, 2) : ''}), h('td', {texto: l.estado === 'ok' ? usd(l.usd) : ''}), h('td', {texto: l.estado === 'ok' ? usd(acumulado) : ''})); }))));
    if (!run.llamadas.length) cuerpo.append(h('div', {class: 'l', texto: 'Esta acción no llama al modelo.'}));
  } else {
    cuerpo.append(h('pre', {class: 'l', texto: run.resultado ? JSON.stringify(run.resultado.datos, null, 2) : 'Todavía no hay un resultado estructurado.'}));
  }
  const cab = h('div', {class: 'dock-cab'}, solo ? h('span', {class: 'tab activa', texto: 'Consola'}) : tabs.map(([k, t]) => h('button', {class: 'tab' + (S.dock === k ? ' activa' : ''), onclick: () => { S.dock = k; S.pegado = true; renderRun(); }}, t)),
    h('span', {class: 'espacio'}),
    solo ? null : h('button', {class: 'boton', title: 'Agrandar o reducir (C)', onclick: alternarDock}, S.dockGrande ? 'Reducir' : 'Agrandar'));
  return h('section', {class: 'dock' + (grande ? ' grande' : '') + (solo ? ' solo' : '')}, cab, cuerpo);
}
function alternarDock() { S.dockGrande = !S.dockGrande; S.pegado = true; renderRun(); }


/* ================= ayuda ================= */
function mostrarAyuda() {
  modal({titulo: 'Acerca de este panel', cuerpo: h('div', null,
    h('p', {texto: 'Compara dos memorias para un agente sobre el mismo corpus de papers de arXiv y con el mismo modelo: un RAG simple (azul) y un wiki que un agente mantiene de forma incremental, el WikiLLM (verde).'}),
    h('ul', null,
      h('li', null, h('b', {texto: 'Preguntar: '}), 'hace una pregunta a los dos y muestra qué hizo cada uno, la respuesta, las citas con su fragmento y el costo.'),
      h('li', null, h('b', {texto: 'Ingerir: '}), 'añade el siguiente paper al wiki; se ve el plan, la escritura y lo que validó el código.'),
      h('li', null, h('b', {texto: 'Wiki: '}), 'el índice, las páginas y el historial versionado.'),
      h('li', null, h('b', {texto: 'Resultados: '}), 'métricas del piloto y estimación del costo de una corrida.'),
      h('li', null, h('b', {texto: 'Sistema: '}), 'estado, verificaciones y reinicio del wiki.')),
    h('p', {texto: 'Las acciones que llaman al modelo piden confirmación y tienen un tope de gasto por sesión. Cada ejecución queda guardada y puede reproducirse sin llamar al modelo; la reproducción siempre se indica. La consola muestra la misma salida que la orden equivalente.'})),
    botones: [{texto: 'Entendido', valor: true, primario: true}]});
}

/* ================= datos y arranque ================= */
async function cargarBase() {
  const [estado, archivos] = await Promise.all([api('/api/estado'), api('/api/archivos')]);
  S.estado = estado; S.archivos = archivos; S.rutasPermitidas = new Set(archivos.map((a) => a.ruta));
}
async function refrescarEstado() {
  try {
    await cargarBase();
    if (firmaBarra() !== S.firmaBarra) renderBarra(); else actualizarGasto();
    return S.estado;
  } catch (e) { return null; }
}
function firma() {
  if (!S.estado) return '';
  return JSON.stringify([S.estado.ocupado && S.estado.ocupado.id, S.estado.rag_listo, S.estado.wiki.ingeridos, S.estado.grabaciones.length]);
}
function alTecla(e) {
  if (hayModal() || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' && !$('#visor').hidden) mostrarVisor(false);
}
async function iniciar() {
  const tema = pref.get('tema', null);
  if (tema) document.documentElement.setAttribute('data-tema', tema);
  try {
    const [acciones, ejemplos] = await Promise.all([api('/api/acciones'), api('/api/ejemplos'), cargarBase()]);
    acciones.forEach((a) => { S.acciones[a.id] = a; });
    S.ejemplos = ejemplos;
  } catch (e) {
    $('#principal').replaceChildren(h('div', {class: 'aviso-error', texto: 'No se pudo conectar con el panel: ' + e.message + '. ¿Sigue corriendo «python -m wikillm.panel»?'}));
    return;
  }
  const inicial = location.hash.slice(1);
  S.vista = VISTAS.some(([id]) => id === inicial) ? inicial : 'preguntar';
  renderBarra();
  cambiarVista(S.vista, true);
  if (pref.get('visor', false)) mostrarVisor(true);
  document.addEventListener('keydown', alTecla);
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VISTAS.some(([id]) => id === v) && v !== S.vista) cambiarVista(v, true); });
  setInterval(async () => {
    if (S.run && S.run.estado === 'corriendo') return;
    const antes = firma();
    await refrescarEstado();
    const editando = document.activeElement && document.activeElement.tagName === 'INPUT' && $('#vista').contains(document.activeElement);
    if (firma() !== antes && !editando) renderVista();
  }, 5000);
  if (S.estado.ocupado && S.estado.ocupado.accion === 'calentar') {
    const es = new EventSource('/api/eventos/' + S.estado.ocupado.id);
    es.onmessage = (m) => { let ev; try { ev = JSON.parse(m.data); } catch (x) { return; } if (ev.t === 'fin') { es.close(); refrescarEstado().then(renderVista); } };
    es.onerror = () => es.close();
  }
}
window.addEventListener('error', (e) => { try { toast('Error en la página: ' + e.message, 'error', 8000); } catch (x) { /* nada */ } });
iniciar();
</script>
